<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SmartRing Clock & Custom Dot Sync</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            overflow: hidden;
        }
        .card {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 350px;
            text-align: center;
        }
        h2 { margin-top: 0; font-size: 18px; color: #ffffff; }
        .clock { font-size: 28px; font-weight: bold; color: #00e5ff; margin: 5px 0 10px 0; }
        
        .canvas-viewport {
            width: 280px;
            height: 280px;
            background: #111;
            border: 2px solid #444;
            border-radius: 8px;
            overflow: hidden;
            margin: 10px auto;
            position: relative;
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .dot-canvas {
            display: grid;
            grid-template-columns: repeat(32, 1fr);
            grid-template-rows: repeat(32, 1fr);
            width: 256px;
            height: 256px;
            min-width: 256px;
            min-height: 256px;
            background-color: #000;
            transform-origin: center center;
            will-change: transform;
        }

        .pixel {
            border: 0.5px solid #1a1a1a;
            background-color: #050505;
            width: 100%; height: 100%;
        }

        .pixel.active {
            background-color: #ffffff !important;
            box-shadow: 0 0 3px #ffffff;
        }

        .pixel[data-y="7"], .pixel[data-y="15"], .pixel[data-y="23"] {
            border-bottom: 1.5px dashed #ff9800 !important;
        }

        .editor-tools {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            width: 100%;
            margin-top: 8px;
        }
        
        .btn {
            flex: 1;
            min-width: 75px;
            padding: 10px 0;
            font-size: 12px;
            font-weight: bold;
            background: #3a3a3a;
            border: 1px solid #555;
            color: #fff;
            border-radius: 8px;
            cursor: pointer;
        }
        .btn-action { width: 100%; margin-top: 8px; padding: 12px 0; font-size: 14px; }
        .btn-primary { background: #0066cc; border-color: #0088ff; }
        .btn-success { background: #28a745; border-color: #34ce57; }
        .btn-disabled { background: #444; color: #888; border-color: #555; cursor: not-allowed; }
        .btn.active-mode { background: #0066cc; border-color: #0088ff; }

        .info-bar {
            margin-top: 8px;
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #00ff66;
            font-family: monospace;
        }

        #log {
            margin-top: 10px;
            padding: 8px;
            background-color: #000;
            border-radius: 6px;
            color: #00ff66;
            font-family: monospace;
            font-size: 11px;
            text-align: left;
            height: 50px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>SmartRing Controller</h2>
    <div class="clock" id="phoneClock">00:00:00</div>

    <div class="canvas-viewport" id="viewport">
        <div id="dotCanvas" class="dot-canvas"></div>
    </div>
    
    <div class="editor-tools">
        <button id="modeBtn" class="btn" onclick="toggleMode()">✏️ 펜 모드</button>
        <button class="btn" onclick="resetZoom()">🔍 줌 리셋</button>
        <button class="btn" onclick="clearCanvas()">🗑️ 전체 지우기</button>
    </div>

    <div class="info-bar">
        <span id="zoomLevel">배율: 1.0x</span>
        <span id="pixelCount">도트: 0 / 1024</span>
    </div>

    <!-- BLE 동작 버튼 -->
    <button id="connectBtn" class="btn btn-action btn-primary" onclick="connectBLE()">1. 스마트링 연결하기</button>
    <button id="syncBtn" class="btn btn-action btn-disabled" onclick="syncData()" disabled>2. 시간 및 커스텀 도트 전송</button>

    <div id="log">> 상태: 대기 중...</div>
</div>

<script>
    const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
    const CHARACTERISTIC_UUID_RX = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";

    let bleDevice = null;
    let rxCharacteristic = null;

    let dotMatrix = Array(32).fill().map(() => Array(32).fill(0));
    let isDrawing = false;
    let isEraseMode = false;

    let scale = 1, pointX = 0, pointY = 0, startDist = 0;
    let isPinching = false, startTouchX = 0, startTouchY = 0;

    const canvas = document.getElementById('dotCanvas');
    const viewport = document.getElementById('viewport');

    function updateClock() {
        const now = new Date();
        const hrs = String(now.getHours()).padStart(2, '0');
        const mins = String(now.getMinutes()).padStart(2, '0');
        const secs = String(now.getSeconds()).padStart(2, '0');
        document.getElementById('phoneClock').innerText = `${hrs}:${mins}:${secs}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    function buildCanvas() {
        canvas.innerHTML = '';
        const fragment = document.createDocumentFragment();

        for (let y = 0; y < 32; y++) {
            for (let x = 0; x < 32; x++) {
                const pixel = document.createElement('div');
                pixel.className = 'pixel';
                pixel.dataset.x = x;
                pixel.dataset.y = y;
                fragment.appendChild(pixel);
            }
        }
        canvas.appendChild(fragment);

        canvas.addEventListener('mousedown', (e) => { isDrawing = true; drawSingle(e.target); });
        window.addEventListener('mouseup', () => { isDrawing = false; });
        canvas.addEventListener('mousemove', (e) => { if (isDrawing) drawSingle(e.target); });

        viewport.addEventListener('touchstart', handleTouchStart, { passive: false });
        viewport.addEventListener('touchmove', handleTouchMove, { passive: false });
        viewport.addEventListener('touchend', handleTouchEnd);
    }

    function handleTouchStart(e) {
        if (e.touches.length === 1) {
            isPinching = false; isDrawing = true;
            drawSingle(document.elementFromPoint(e.touches[0].clientX, e.touches[0].clientY));
        } else if (e.touches.length === 2) {
            isDrawing = false; isPinching = true;
            startDist = getDistance(e.touches);
            startTouchX = (e.touches[0].clientX + e.touches[1].clientX) / 2 - pointX;
            startTouchY = (e.touches[0].clientY + e.touches[1].clientY) / 2 - pointY;
        }
    }

    function handleTouchMove(e) {
        e.preventDefault();
        if (isDrawing && e.touches.length === 1) {
            drawSingle(document.elementFromPoint(e.touches[0].clientX, e.touches[0].clientY));
        } else if (isPinching && e.touches.length === 2) {
            const newDist = getDistance(e.touches);
            scale = Math.min(Math.max(1, scale * (newDist / startDist)), 4.5);
            startDist = newDist;
            pointX = (e.touches[0].clientX + e.touches[1].clientX) / 2 - startTouchX;
            pointY = (e.touches[0].clientY + e.touches[1].clientY) / 2 - startTouchY;
            updateTransform();
        }
    }

    function handleTouchEnd(e) {
        if (e.touches.length < 2) isPinching = false;
        if (e.touches.length === 0) isDrawing = false;
    }

    function getDistance(touches) {
        return Math.hypot(touches[0].clientX - touches[1].clientX, touches[0].clientY - touches[1].clientY);
    }

    function updateTransform() {
        if (scale === 1) { pointX = 0; pointY = 0; }
        canvas.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`;
        document.getElementById('zoomLevel').innerText = `배율: ${scale.toFixed(1)}x`;
    }

    function resetZoom() { scale = 1; pointX = 0; pointY = 0; updateTransform(); }

    function drawSingle(target) {
        if (!target || !target.classList.contains('pixel')) return;
        const x = parseInt(target.dataset.x, 10);
        const y = parseInt(target.dataset.y, 10);
        const val = isEraseMode ? 0 : 1;
        if (dotMatrix[y][x] !== val) {
            dotMatrix[y][x] = val;
            if (val === 1) target.classList.add('active');
            else target.classList.remove('active');
            updateCount();
        }
    }

    function toggleMode() {
        isEraseMode = !isEraseMode;
        const btn = document.getElementById('modeBtn');
        btn.innerText = isEraseMode ? "🧹 지우개" : "✏️ 펜 모드";
        if (isEraseMode) btn.classList.add('active-mode');
        else btn.classList.remove('active-mode');
    }

    function clearCanvas() {
        dotMatrix = Array(32).fill().map(() => Array(32).fill(0));
        document.querySelectorAll('.pixel').forEach(p => p.classList.remove('active'));
        updateCount();
    }

    function updateCount() {
        let activeCount = 0;
        for (let y = 0; y < 32; y++) {
            for (let x = 0; x < 32; x++) if (dotMatrix[y][x] === 1) activeCount++;
        }
        document.getElementById('pixelCount').innerText = `도트: ${activeCount} / 1024`;
    }

    // 128바이트 비트맵 인코딩
    function get32x32BitmapBytes() {
        let bytes = new Uint8Array(128);
        for (let y = 0; y < 32; y++) {
            for (let x = 0; x < 32; x++) {
                if (dotMatrix[y][x] === 1) {
                    let byteIdx = (y * 4) + Math.floor(x / 8);
                    let bitIdx = 7 - (x % 8);
                    bytes[byteIdx] |= (1 << bitIdx);
                }
            }
        }
        return bytes;
    }

    // BLE 연결
    async function connectBLE() {
        log("스마트링 검색 중...");
        try {
            bleDevice = await navigator.bluetooth.requestDevice({
                filters: [{ name: 'SmartRing_Clock' }],
                optionalServices: [SERVICE_UUID]
            });
            const server = await bleDevice.gatt.connect();
            const service = await server.getPrimaryService(SERVICE_UUID);
            rxCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID_RX);

            log("연결 성공!");
            const syncBtn = document.getElementById('syncBtn');
            syncBtn.disabled = false;
            syncBtn.className = "btn btn-action btn-success";
        } catch (error) {
            log("연결 실패: " + error.message);
        }
    }

    // 시간 & 비트맵 데이터 분할 전송
    async function syncData() {
        if (!rxCharacteristic) return;
        try {
            const now = new Date();
            const timeStr = `T:${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
            await rxCharacteristic.writeValue((new TextEncoder()).encode(timeStr));
            log("시간 전송 완료!");

            const bitmap = get32x32BitmapBytes();
            for (let i = 0; i < 128; i += 32) {
                const chunk = bitmap.slice(i, i + 32);
                const packet = new Uint8Array(2 + chunk.length);
                packet[0] = 66; // ASCII 'B' (Bitmap Packet)
                packet[1] = i;  // Chunk Offset Index (0, 32, 64, 96)
                packet.set(chunk, 2);
                
                await rxCharacteristic.writeValue(packet);
                await new Promise(r => setTimeout(r, 60));
            }
            log("동기화 완벽 완료!");
        } catch (error) {
            log("전송 오류: " + error.message);
        }
    }

    function log(msg) { document.getElementById('log').innerText = "> " + msg; }

    buildCanvas();
</script>

</body>
</html>
