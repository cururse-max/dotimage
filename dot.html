<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>32x32 Dot Editor with Battery Guide</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            overflow: hidden;
        }
        .card {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 350px;
            text-align: center;
        }
        h2 {
            margin-top: 0;
            font-size: 18px;
            color: #ffffff;
        }
        
        /* 뷰포트 (확대/축소 영역) */
        .canvas-viewport {
            width: 280px;
            height: 280px;
            background: #111;
            border: 2px solid #444;
            border-radius: 8px;
            overflow: hidden;
            margin: 10px auto;
            position: relative;
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 32x32 캔버스 레이아웃 */
        .dot-canvas {
            display: grid;
            grid-template-columns: repeat(32, 1fr);
            grid-template-rows: repeat(32, 1fr);
            width: 256px;
            height: 256px;
            min-width: 256px;
            min-height: 256px;
            background-color: #000;
            transform-origin: center center;
            will-change: transform;
            position: relative;
        }

        .pixel {
            border: 0.5px solid #1a1a1a;
            background-color: #050505;
            width: 100%;
            height: 100%;
        }

        /* 켜진 픽셀 색상: 흰색 (#FFFFFF) */
        .pixel.active {
            background-color: #ffffff !important;
            box-shadow: 0 0 3px #ffffff;
        }

        /* 배터리 잔량 25% 단위 (8px 간격) 가로 점선 구부선 */
        .pixel[data-y="7"] { border-bottom: 1.5px dashed #ff9800 !important; }  /* 75% 높이 라인 */
        .pixel[data-y="15"] { border-bottom: 1.5px dashed #ff9800 !important; } /* 50% 높이 라인 */
        .pixel[data-y="23"] { border-bottom: 1.5px dashed #ff9800 !important; } /* 25% 높이 라인 */

        .editor-tools {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            width: 100%;
            margin-top: 10px;
        }
        
        .btn {
            flex: 1;
            min-width: 80px;
            padding: 10px 0;
            font-size: 12px;
            font-weight: bold;
            background: #3a3a3a;
            border: 1px solid #555;
            color: #fff;
            border-radius: 8px;
            cursor: pointer;
        }
        .btn.active-mode {
            background: #0066cc;
            border-color: #0088ff;
        }

        .info-bar {
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #00ff66;
            font-family: monospace;
            padding: 0 5px;
        }

        .guide-label {
            font-size: 11px;
            color: #ff9800;
            margin-top: 4px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>32x32 커스텀 도트 에디터</h2>
    <div class="guide-label">주황색 점선: 배터리 25% / 50% / 75% 가이드</div>

    <div class="canvas-viewport" id="viewport">
        <div id="dotCanvas" class="dot-canvas"></div>
    </div>
    
    <div class="editor-tools">
        <button id="modeBtn" class="btn" onclick="toggleMode()">✏️ 펜 모드</button>
        <button class="btn" onclick="resetZoom()">🔍 위치 리셋</button>
        <button class="btn" onclick="clearCanvas()">🗑️ 전체 지우기</button>
    </div>

    <div class="info-bar">
        <span id="zoomLevel">배율: 1.0x</span>
        <span id="pixelCount">도트: 0 / 1024</span>
    </div>
</div>

<script>
    let dotMatrix = Array(32).fill().map(() => Array(32).fill(0));
    let isDrawing = false;
    let isEraseMode = false;

    // Zoom & Pan 제어 변수
    let scale = 1;
    let pointX = 0;
    let pointY = 0;
    let startDist = 0;
    let isPinching = false;
    let startTouchX = 0;
    let startTouchY = 0;

    const canvas = document.getElementById('dotCanvas');
    const viewport = document.getElementById('viewport');

    function buildCanvas() {
        canvas.innerHTML = '';
        const fragment = document.createDocumentFragment();

        for (let y = 0; y < 32; y++) {
            for (let x = 0; x < 32; x++) {
                const pixel = document.createElement('div');
                pixel.className = 'pixel';
                pixel.dataset.x = x;
                pixel.dataset.y = y;
                fragment.appendChild(pixel);
            }
        }
        canvas.appendChild(fragment);

        // PC 마우스
        canvas.addEventListener('mousedown', (e) => {
            isDrawing = true;
            drawSingle(e.target);
        });
        window.addEventListener('mouseup', () => { isDrawing = false; });
        canvas.addEventListener('mousemove', (e) => {
            if (isDrawing) drawSingle(e.target);
        });

        // 모바일 터치 (핀치 줌 & 드로잉)
        viewport.addEventListener('touchstart', handleTouchStart, { passive: false });
        viewport.addEventListener('touchmove', handleTouchMove, { passive: false });
        viewport.addEventListener('touchend', handleTouchEnd);
    }

    function handleTouchStart(e) {
        if (e.touches.length === 1) {
            isPinching = false;
            isDrawing = true;
            const target = document.elementFromPoint(e.touches[0].clientX, e.touches[0].clientY);
            drawSingle(target);
        } else if (e.touches.length === 2) {
            isDrawing = false;
            isPinching = true;
            startDist = getDistance(e.touches);
            startTouchX = (e.touches[0].clientX + e.touches[1].clientX) / 2 - pointX;
            startTouchY = (e.touches[0].clientY + e.touches[1].clientY) / 2 - pointY;
        }
    }

    function handleTouchMove(e) {
        e.preventDefault();
        
        if (isDrawing && e.touches.length === 1) {
            const touch = e.touches[0];
            const target = document.elementFromPoint(touch.clientX, touch.clientY);
            drawSingle(target);
        } else if (isPinching && e.touches.length === 2) {
            const newDist = getDistance(e.touches);
            const factor = newDist / startDist;
            startDist = newDist;

            scale = Math.min(Math.max(1, scale * factor), 4.5);

            const currentX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
            const currentY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
            pointX = currentX - startTouchX;
            pointY = currentY - startTouchY;

            updateTransform();
        }
    }

    function handleTouchEnd(e) {
        if (e.touches.length < 2) isPinching = false;
        if (e.touches.length === 0) isDrawing = false;
    }

    function getDistance(touches) {
        return Math.hypot(
            touches[0].clientX - touches[1].clientX,
            touches[0].clientY - touches[1].clientY
        );
    }

    function updateTransform() {
        if (scale === 1) {
            pointX = 0;
            pointY = 0;
        }
        canvas.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`;
        document.getElementById('zoomLevel').innerText = `배율: ${scale.toFixed(1)}x`;
    }

    function resetZoom() {
        scale = 1;
        pointX = 0;
        pointY = 0;
        updateTransform();
    }

    function drawSingle(target) {
        if (!target || !target.classList.contains('pixel')) return;
        const x = parseInt(target.dataset.x, 10);
        const y = parseInt(target.dataset.y, 10);
        
        const val = isEraseMode ? 0 : 1;
        if (dotMatrix[y][x] !== val) {
            dotMatrix[y][x] = val;
            if (val === 1) {
                target.classList.add('active');
            } else {
                target.classList.remove('active');
            }
            updateCount();
        }
    }

    function toggleMode() {
        isEraseMode = !isEraseMode;
        const btn = document.getElementById('modeBtn');
        if (isEraseMode) {
            btn.innerText = "🧹 지우개";
            btn.classList.add('active-mode');
        } else {
            btn.innerText = "✏️ 펜 모드";
            btn.classList.remove('active-mode');
        }
    }

    function clearCanvas() {
        dotMatrix = Array(32).fill().map(() => Array(32).fill(0));
        document.querySelectorAll('.pixel').forEach(p => p.classList.remove('active'));
        updateCount();
    }

    function updateCount() {
        let activeCount = 0;
        for (let y = 0; y < 32; y++) {
            for (let x = 0; x < 32; x++) {
                if (dotMatrix[y][x] === 1) activeCount++;
            }
        }
        document.getElementById('pixelCount').innerText = `도트: ${activeCount} / 1024`;
    }

    buildCanvas();
</script>

</body>
</html>
