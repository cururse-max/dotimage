<div class="dot-editor-container">
    <div class="editor-header">
        <span class="status-indicator">● 32x32 배터리 도트 에디터</span>
    </div>
    
    <!-- 터치 드로잉 캔버스 -->
    <div id="dotCanvas" class="dot-canvas"></div>
    
    <div class="editor-tools">
        <button id="modeBtn" class="btn tool-btn" onclick="toggleMode()">✏️ 펜 (칠하기)</button>
        <button class="btn tool-btn erase-all" onclick="clearCanvas()">🗑️ 전체 지우기</button>
    </div>
</div>
