<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>32x32 Dot Canvas Test</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
        }
        .card {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 340px;
            text-align: center;
        }
        h2 {
            margin-top: 0;
            font-size: 18px;
            color: #ffffff;
        }
        
        /* 32x32 도트 캔버스 컨테이너 */
        .dot-editor-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #282828;
            padding: 12px;
            border-radius: 12px;
            margin: 15px 0;
            width: 100%;
        }
        
        /* CSS Grid 명확한 규격 지정 */
        .dot-canvas {
            display: grid;
            grid-template-columns: repeat(32, 1fr);
            grid-template-rows: repeat(32, 1fr);
            width: 256px;
            height: 256px;
            min-width: 256px;
            min-height: 256px;
            border: 2px solid #555;
            background-color: #000;
            touch-action: none; /* 모바일 화면 스크롤 절대 방지 */
            margin: 0 auto;
        }

        .pixel {
            border: 0.5px solid #1a1a1a;
            background-color: #050505;
            width: 100%;
            height: 100%;
        }

        .pixel.active {
            background-color: #00e5ff !important;
            box-shadow: 0 0 2px #00e5ff;
        }

        .editor-tools {
            display: flex;
            gap: 8px;
            width: 256px;
            margin-top: 12px;
        }
        
        .btn {
            flex: 1;
            padding: 12px 0;
            font-size: 13px;
            font-weight: bold;
            background: #3a3a3a;
            border: 1px solid #555;
            color: #fff;
            border-radius: 8px;
            cursor: pointer;
        }
        .btn.active-mode {
            background: #0066cc;
            border-color: #0088ff;
        }

        #pixelCount {
            margin-top: 10px;
            font-size: 13px;
            color: #00ff66;
            font-family: monospace;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>32x32 터치 드로잉 테스트</h2>
    
    <div class="dot-editor-container">
        <!-- 32x32 그리드 캔버스 -->
        <div id="dotCanvas" class="dot-canvas"></div>
        
        <div class="editor-tools">
            <button id="modeBtn" class="btn" onclick="toggleMode()">✏️ 펜 모드</button>
            <button class="btn" onclick="clearCanvas()">🗑️ 전체 지우기</button>
        </div>
    </div>

    <div id="pixelCount">켜진 픽셀 수: 0 / 1024</div>
</div>

<script>
    let dotMatrix = Array(32).fill().map(() => Array(32).fill(0));
    let isDrawing = false;
    let isEraseMode = false;

    function buildCanvas() {
        const canvas = document.getElementById('dotCanvas');
        if (!canvas) return;
        
        canvas.innerHTML = '';
        const fragment = document.createDocumentFragment();

        for (let y = 0; y < 32; y++) {
            for (let x = 0; x < 32; x++) {
                const pixel = document.createElement('div');
                pixel.className = 'pixel';
                pixel.dataset.x = x;
                pixel.dataset.y = y;
                fragment.appendChild(pixel);
            }
        }
        canvas.appendChild(fragment);

        // PC 마우스 이벤트
        canvas.addEventListener('mousedown', (e) => {
            isDrawing = true;
            drawSingle(e.target);
        });
        window.addEventListener('mouseup', () => { isDrawing = false; });
        canvas.addEventListener('mousemove', (e) => {
            if (isDrawing) drawSingle(e.target);
        });

        // 모바일 터치 이벤트 (elementFromPoint 사용으로 연속 드래그 완벽 감지)
        canvas.addEventListener('touchstart', (e) => {
            isDrawing = true;
            handleTouch(e);
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            if (isDrawing) handleTouch(e);
        }, { passive: false });

        window.addEventListener('touchend', () => { isDrawing = false; });
    }

    function handleTouch(e) {
        if (e.touches && e.touches.length > 0) {
            e.preventDefault();
            const touch = e.touches[0];
            const target = document.elementFromPoint(touch.clientX, touch.clientY);
            if (target && target.classList.contains('pixel')) {
                drawSingle(target);
            }
        }
    }

    function drawSingle(target) {
        if (!target || !target.classList.contains('pixel')) return;
        const x = parseInt(target.dataset.x, 10);
        const y = parseInt(target.dataset.y, 10);
        
        const val = isEraseMode ? 0 : 1;
        if (dotMatrix[y][x] !== val) {
            dotMatrix[y][x] = val;
            if (val === 1) {
                target.classList.add('active');
            } else {
                target.classList.remove('active');
            }
            updateCount();
        }
    }

    function toggleMode() {
        isEraseMode = !isEraseMode;
        const btn = document.getElementById('modeBtn');
        if (isEraseMode) {
            btn.innerText = "🧹 지우개 모드";
            btn.classList.add('active-mode');
        } else {
            btn.innerText = "✏️ 펜 모드";
            btn.classList.remove('active-mode');
        }
    }

    function clearCanvas() {
        dotMatrix = Array(32).fill().map(() => Array(32).fill(0));
        const pixels = document.querySelectorAll('.pixel');
        pixels.forEach(p => p.classList.remove('active'));
        updateCount();
    }

    function updateCount() {
        let activeCount = 0;
        for (let y = 0; y < 32; y++) {
            for (let x = 0; x < 32; x++) {
                if (dotMatrix[y][x] === 1) activeCount++;
            }
        }
        document.getElementById('pixelCount').innerText = `켜진 픽셀 수: ${activeCount} / 1024`;
    }

    // DOM로드 시 및 즉시 실행 보장
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', buildCanvas);
    } else {
        buildCanvas();
    }
</script>

</body>
</html>
